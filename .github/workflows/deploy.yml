name: Deploy Plasmex Builder to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Angular Builder
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Compilar para Producción
        run: npm run build:prod

      - name: 🚀 Desplegar por SSH a Hostinger
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST || '31.170.166.250' }}
          REMOTE_USER: ${{ secrets.SSH_USER || 'u740702945' }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '65002' }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "dist/builder/browser/"
          TARGET: ${{ secrets.BUILDER_TARGET_DIR || '/home/u740702945/domains/builder.plasmexsiga.com/public_html' }}
          EXCLUDE: "/.git/, /node_modules/, /.github/"
