name: Deploy Plasmex Builder to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Angular Builder
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Compilar para Producción
        run: npm run build:prod

      - name: 🔑 Configurar Llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '65002' }} -H ${{ secrets.SSH_HOST || '31.170.166.250' }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Sincronizar Archivos a Hostinger con Rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT || '65002' }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" dist/builder/browser/ ${{ secrets.SSH_USER || 'u740702945' }}@${{ secrets.SSH_HOST || '31.170.166.250' }}:${{ secrets.TARGET_DIR }}
