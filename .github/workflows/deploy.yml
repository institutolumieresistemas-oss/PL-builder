name: Deploy Plasmex Builder to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Angular Builder
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Compilar para Producción
        run: npm run build:prod

      - name: 🔑 Configurar Llave SSH
        env:
          RAW_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 -c "
          import os, base64
          raw = os.environ.get('RAW_SSH_KEY', '').strip()
          if 'BEGIN' in raw:
              key = raw
          else:
              cleaned = ''.join(raw.split())
              key = base64.b64decode(cleaned).decode('utf-8')
          path = os.path.expanduser('~/.ssh/deploy_key')
          with open(path, 'w') as f:
              f.write(key.strip() + '\n')
          "
          chmod 600 ~/.ssh/deploy_key
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            IdentityFile ~/.ssh/deploy_key
          EOF
          chmod 600 ~/.ssh/config

      - name: 🚀 Sincronizar Archivos a Hostinger con Rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT || '65002' }} -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -i ~/.ssh/deploy_key" dist/builder/browser/ ${{ secrets.SSH_USER || 'u740702945' }}@${{ secrets.SSH_HOST || '31.170.166.250' }}:${{ secrets.TARGET_DIR }}
